# Breadcrumb trail items, used by the `breadcrumbs` component's `items` array
# input.
#
# Must live here, not in the component's inputs.yml — `_structures` is not a
# valid key in an `_inputs_from_glob` file.
breadcrumbItems:
  values:
    - label: Breadcrumb
      icon: chevron_right
      value:
        label: ""
        url: ""
      _inputs:
        label:
          type: text
          comment: "Display text for this crumb."
        url:
          type: url
          comment: "Link target for this crumb. Leave empty on the final (current page) crumb — it renders as plain text."
          options:
            hide_link_to_file: true
            hide_link_to_email_address: true
            hide_link_to_telephone: true
