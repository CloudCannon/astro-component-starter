# Three-level navigation item structures, shared by every nav component
# (`bar`, `main-nav`, `mobile`, `side`). Must live here, not in a component's
# inputs.yml — `_structures` is not a valid key in an `_inputs_from_glob` file,
# and these names are global, so per-component copies silently collide.
#
# `path` is a `url` input with the file/email/telephone options suppressed, since
# nav items point at site pages. Levels 1 and 2 nest via `children`; level 3 has
# none.
navItemLevel1:
  values:
    - label: Navigation Item (Level 1)
      icon: link
      value:
        name: ""
        path: ""
        children: []
      _inputs:
        name:
          type: text
          comment: "Display text for the navigation item."
        path:
          type: url
          comment: "URL path for the navigation item."
          options:
            hide_link_to_file: true
            hide_link_to_email_address: true
            hide_link_to_telephone: true
        children:
          type: array
          comment: "Child navigation items for dropdown menus."
          options:
            structures: _structures.navItemLevel2
navItemLevel2:
  values:
    - label: Navigation Item (Level 2)
      icon: link
      value:
        name: ""
        path: ""
        children: []
      _inputs:
        name:
          type: text
          comment: "Display text for the child navigation item."
        path:
          type: url
          comment: "URL path for the child navigation item."
          options:
            hide_link_to_file: true
            hide_link_to_email_address: true
            hide_link_to_telephone: true
        children:
          type: array
          comment: "Grandchild navigation items for nested dropdowns."
          options:
            structures: _structures.navItemLevel3
navItemLevel3:
  values:
    - label: Navigation Item (Level 3)
      icon: link
      value:
        name: ""
        path: ""
      _inputs:
        name:
          type: text
          comment: "Display text for the grandchild navigation item."
        path:
          type: url
          comment: "URL path for the grandchild navigation item."
          options:
            hide_link_to_file: true
            hide_link_to_email_address: true
            hide_link_to_telephone: true
