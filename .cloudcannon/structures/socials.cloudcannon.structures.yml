socials:
  style: modal
  values:
    - label: Social Link
      icon: share
      description: A social media link with icon and URL.
      value:
        icon: ""
        link: ""
        label: ""
      preview:
        text:
          - key: icon
          - Social Link
        subtext:
          - key: link
          - Add URL
      picker_preview:
        text: Social Link
        subtext: A social media link with icon and URL.
        icon: share
      _inputs:
        icon:
          type: select
          comment: Icon to display for the social media link. Sourced from [Heroicons](https://heroicons.com/).
          options:
            values: data.icons
            preview:
              text:
                - key: name
              image:
                - template: src/icons/{id}.svg
        link:
          type: text
          comment: URL for the social media link.
        label:
          type: text
          comment: Optional accessible label for the link (e.g. "Visit us on X"). Defaults to "Visit our <icon> page".
