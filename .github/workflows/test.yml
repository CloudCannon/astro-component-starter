name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ${{matrix.os}}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - build: linux
            os: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: npm
          node-version-file: .nvmrc

      - name: Verify lockfile is in sync
        run: |
          if ! npm run deps:check > /dev/null 2>&1; then
            echo "::error::package-lock.json is out of sync with package.json."
            echo "This job installs the Linux/Windows optional dependencies (sharp, pagefind, rollup native binaries), so they have to be in the lockfile."
            echo "Run 'npm run deps:sync' locally, commit the updated package-lock.json, and push again."
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

  # Blocking on purpose: the lockfile was re-resolved to clear eight advisories,
  # so a regression must fail the job.
  audit:
    name: Audit dependencies
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: npm
          node-version-file: .nvmrc

      - name: Fail on high or critical advisories
        run: npm audit --audit-level=high

  build:
    name: Build all components
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: npm
          node-version-file: .nvmrc

      - name: Install
        run: npm ci

      - name: Render every component's structure defaults
        run: npm run test:render

  # Builds twice, so it gets its own job.
  css-parity:
    name: CSS pruning parity
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: npm
          node-version-file: .nvmrc

      - name: Install
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright-core install --with-deps chromium

      - name: Compare unpruned and pruned builds
        run: npm run test:css-parity

  # The script finds Chrome via Playwright's Chromium, so installing it is enough.
  browser-tests:
    name: Smoke tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: npm
          node-version-file: .nvmrc

      - name: Install
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright-core install --with-deps chromium

      - name: Build site with component library
        run: npm run build:with-library

      - name: Check for dead page-section margins
        run: npm run test:flow-margins

      - name: Smoke-test interactive components
        run: npm run test:smoke
