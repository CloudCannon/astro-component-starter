# Default for inputs without their own `options.paths`. Top level only — a
# `paths:` block inside a collection is silently ignored.
paths:
  uploads: src/assets/images

collections_config:
  pages:
    path: src/content/pages
    glob:
      - "**/*.md"
    url: /[full_slug]/
    icon: web
    _enabled_editors:
      - visual
    add_options:
      - name: Add New Page
        schema: default
        icon: pages
    schemas:
      default:
        name: New Page
        path: .cloudcannon/schemas/page.md
        remove_extra_inputs: false
    create:
      path: "[relative_base_path]/{filename|slugify|lowercase}.md"
    new_preview_url: /
    _inputs:
      title:
        type: text
        comment: Controls the metadata title for the page.
      keywords:
        type: array
        comment: Optional meta keywords for this page.
      keywords[*]:
        type: text
  blog:
    path: src/content/blog
    glob:
      - "**/*.mdx"
    url: /blog/[full_slug]/
    disable_url: false
    icon: article
    _enabled_editors:
      - content
      - visual
    add_options:
      - name: Add New Blog Post
        schema: default
        icon: article
    schemas:
      default:
        name: New Blog Post
        path: .cloudcannon/schemas/blog-post.mdx
        remove_extra_inputs: false
    create:
      path: "[relative_base_path]/{filename|slugify|lowercase}.mdx"
    new_preview_url: /blog/
    _inputs:
      title:
        type: text
        comment: The title of the blog post.
      description:
        type: text
        comment: A brief description of the blog post.
      date:
        type: date
        comment: The publication date.
      author:
        type: text
        comment: The author of the blog post.
      image:
        type: image
        comment: Optional image path for the blog post.
        options:
          paths:
            uploads: src/assets/images
          resize_style: contain
          width: 1920
          height: 1280
      tags:
        type: array
        comment: Tags relevant to this post's content.
      tags[*]:
        type: text
      keywords:
        type: array
        comment: Optional meta keywords for this post.
      keywords[*]:
        type: text
      showToc:
        type: switch
        comment: Show an "On this page" table of contents built from the post's headings.
    _editables:
      content:
        format: p h2 h3 h4 h5 h6
        bold: true
        italic: true
        link: true
        bulletedlist: true
        numberedlist: true
        blockquote: true
        code: true
        horizontalrule: true
        snippet: true
        undo: true
        redo: true
        removeformat: true
  data:
    path: src/data
    glob:
      - "**/*.json"
    disable_url: true
    icon: database
    _enabled_editors:
      - data
    schemas:
      announcementBar:
        name: Announcement Bar
        path: .cloudcannon/schemas/announcementBar.json
        remove_extra_inputs: false
        preview:
          text:
            - Announcement Bar
        _inputs:
          enabled:
            type: switch
            comment: Show the announcement bar at the top of every page.
          text:
            type: markdown
            comment: The announcement message. Add a Markdown link for an optional call to action.
            options:
              bold: true
              italic: true
              link: true
      breadcrumbs:
        name: Breadcrumbs
        path: .cloudcannon/schemas/breadcrumbs.json
        remove_extra_inputs: false
        preview:
          text:
            - Breadcrumbs
        _inputs:
          homeLabel:
            comment: Label for the leading crumb that links to the homepage in blog breadcrumbs.
      seo:
        name: SEO Settings
        path: .cloudcannon/schemas/seo.json
        remove_extra_inputs: false
        preview:
          text:
            - SEO
        _inputs:
          name:
            comment: Site name used in structured data and as the fallback brand name in SEO metadata.
          url:
            comment: Production site URL used for canonical links and structured data.
          description:
            comment: Default meta description used when a page or blog post does not provide its own description.
          logoSource:
            comment: Site logo. Also the last-resort social sharing image, though social networks cannot render an SVG one.
          shareImage:
            comment: Default social sharing image, 1200x630. Used when a page or blog post does not provide its own, and when generated cards are turned off below.
          logoAlternateSource:
            comment: Logo for dark backgrounds. Used on a generated share card when the card theme is Dark.
          shareImageGeneration:
            comment: Draw a share card automatically for pages and blog posts that have no image of their own.
          shareImageTheme:
            comment: Whether generated share cards use the site's light or dark colours.
          titleFormat:
            comment: Browser title template. Include {title} where the page title should appear.
          twitterSite:
            comment: Optional X (Twitter) handle for the site, including the @, used in social share cards.
    _inputs:
      logoSource:
        type: image
        options:
          paths:
            uploads: src/assets/images
          resize_style: contain
          width: 1920
          height: 1280
      shareImage:
        type: image
        options:
          paths:
            uploads: src/assets/images
          resize_style: cover
          width: 1200
          height: 630
      shareImageGeneration:
        type: select
        options:
          values:
            - value: all
              label: Pages and blog posts
            - value: blog
              label: Blog posts only
            - value: none
              label: "Off: use the sharing image above"
      shareImageTheme:
        type: select
        options:
          values:
            - value: light
              label: Light
            - value: dark
              label: Dark
      logoAlternateSource:
        type: image
        options:
          paths:
            uploads: src/assets/images
          resize_style: contain
          width: 1920
          height: 1280
      image:
        type: image
        options:
          paths:
            uploads: src/assets/images
          resize_style: contain
          width: 1920
          height: 1280
collection_groups:
  - heading: Content
    collections:
      - pages
      - blog
  - heading: Data
    collections:
      - data
_inputs:
  pageSections:
    comment: The main sections of the page.
  logoSource:
    type: image
  logoAlternateSource:
    type: image
data_config:
  icons:
    path: .cloudcannon/data/icons.yml
  autocomplete_tokens:
    path: .cloudcannon/data/autocomplete-tokens.yml

_structures_from_glob:
  - /.cloudcannon/structures/*.cloudcannon.structures.yml
_snippets_imports:
  mdx: true
_snippets_from_glob:
  - /**/*.cloudcannon.snippets.yml
