<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t-badge">
  <title id="t-badge">Badge component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #151515;
        --pv-panel: #1D1D1B;
        --pv-surface: #232320;
        --pv-line: #2E2D29;
        --pv-glyph: #45443E;
        --pv-body: #3A3934;
        --pv-subject: #6E6A62;
        --pv-ink: #F5F3EE;
        --pv-on-ink: #6B6B6B;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 -40)">
    <rect x="480" y="378" width="160" height="44" rx="22" fill="var(--pv-paper, #FFFFFF)" stroke="var(--pv-glyph, #CFCBC2)" stroke-width="2"/>
    <rect x="502" y="393" width="14" height="14" rx="7" fill="var(--pv-subject, #A8A398)"/>
    <rect x="528" y="396" width="92" height="8" rx="4" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="664" y="378" width="136" height="44" rx="22" fill="var(--pv-ink, #151515)"/>
    <rect x="686" y="396" width="92" height="8" rx="4" fill="var(--pv-on-ink, #9A9A9A)"/>
  </g>
</svg>
