<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="t-video">
  <title id="t-video">Video component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #151515;
        --pv-panel: #1D1D1B;
        --pv-surface: #232320;
        --pv-line: #2E2D29;
        --pv-glyph: #45443E;
        --pv-body: #3A3934;
        --pv-subject: #6E6A62;
        --pv-ink: #F5F3EE;
        --pv-on-ink: #6B6B6B;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="800" fill="var(--pv-paper, #FFFFFF)"/>
  <g>
    <rect x="160" y="130" width="960" height="540" rx="10" fill="var(--pv-surface, #EBE9E3)"/>
    <circle cx="640" cy="400" r="72" fill="var(--pv-subject, #A8A398)"/>
    <polygon points="620,362 620,438 686,400" fill="var(--pv-paper, #FFFFFF)"/>
  </g>
</svg>
