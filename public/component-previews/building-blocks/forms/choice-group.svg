    <rect x="545" y="163" width="170" height="12" rx="6" fill="var(--pv-glyph, #CFCBC2)"/>
    <rect x="505" y="212" width="26" height="26" rx="6" fill="var(--pv-glyph, #CFCBC2)"/>
