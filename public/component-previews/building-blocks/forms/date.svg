    <rect x="342" y="362" width="40" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="394" y="362" width="72" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="955" y="351" width="34" height="34" rx="10" fill="var(--pv-subject, #A8A398)"/>
    <rect x="954" y="362" width="36" height="3" fill="var(--pv-paper, #FFFFFF)"/>
