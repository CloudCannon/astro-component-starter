<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t-form">
  <title id="t-form">Form component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #151515;
        --pv-panel: #1D1D1B;
        --pv-surface: #232320;
        --pv-line: #2E2D29;
        --pv-glyph: #45443E;
        --pv-body: #3A3934;
        --pv-subject: #6E6A62;
        --pv-ink: #F5F3EE;
        --pv-on-ink: #6B6B6B;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 142)">
    <rect x="260" y="0" width="146" height="16" rx="8" fill="var(--pv-subject, #A8A398)"/>
    <rect x="260" y="26" width="760" height="54" rx="10" fill="var(--pv-paper, #FFFFFF)" stroke="var(--pv-glyph, #CFCBC2)" stroke-width="3"/>
    <rect x="260" y="108" width="205" height="16" rx="8" fill="var(--pv-subject, #A8A398)"/>
    <rect x="260" y="134" width="760" height="54" rx="10" fill="var(--pv-paper, #FFFFFF)" stroke="var(--pv-glyph, #CFCBC2)" stroke-width="3"/>
    <polygon points="965,158 978,158 972,165" fill="var(--pv-glyph, #CFCBC2)" stroke="var(--pv-glyph, #CFCBC2)" stroke-width="6" stroke-linejoin="round"/>
    <rect x="260" y="216" width="117" height="16" rx="8" fill="var(--pv-subject, #A8A398)"/>
    <rect x="260" y="242" width="760" height="110" rx="10" fill="var(--pv-paper, #FFFFFF)" stroke="var(--pv-glyph, #CFCBC2)" stroke-width="3"/>
    <rect x="260" y="384" width="166" height="52" rx="10" fill="var(--pv-ink, #151515)"/>
    <rect x="312" y="406" width="62" height="8" rx="4" fill="var(--pv-on-ink, #9A9A9A)"/>
  </g>
</svg>
