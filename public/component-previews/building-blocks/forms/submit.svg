<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="t-submit">
  <title id="t-submit">Submit component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #151515;
        --pv-panel: #1D1D1B;
        --pv-surface: #232320;
        --pv-line: #2E2D29;
        --pv-glyph: #45443E;
        --pv-body: #3A3934;
        --pv-subject: #6E6A62;
        --pv-ink: #F5F3EE;
        --pv-on-ink: #6B6B6B;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="800" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 362)">
    <rect x="530" y="0" width="220" height="76" rx="10" fill="var(--pv-ink, #151515)"/>
    <rect x="584" y="32" width="112" height="12" rx="6" fill="var(--pv-on-ink, #9A9A9A)"/>
