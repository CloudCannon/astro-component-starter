<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t-toggle">
  <title id="t-toggle">Toggle component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #151515;
        --pv-panel: #1D1D1B;
        --pv-surface: #232320;
        --pv-line: #2E2D29;
        --pv-glyph: #45443E;
        --pv-body: #3A3934;
        --pv-subject: #6E6A62;
        --pv-ink: #F5F3EE;
        --pv-on-ink: #6B6B6B;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 334)">
    <rect x="360" y="0" width="97" height="52" rx="26" fill="var(--pv-ink, #151515)"/>
    <circle cx="431" cy="26" r="18" fill="var(--pv-paper, #FFFFFF)"/>
    <rect x="494" y="13" width="426" height="26" rx="13" fill="var(--pv-subject, #A8A398)"/>
  </g>
</svg>
