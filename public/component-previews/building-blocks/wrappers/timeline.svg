    <rect x="694" y="128" width="226" height="26" rx="13" fill="var(--pv-subject, #A8A398)"/>
    <rect x="694" y="164" width="104" height="8" rx="4" fill="var(--pv-on-ink, #9A9A9A)"/>
    <rect x="631" y="256" width="18" height="18" rx="9" fill="var(--pv-ink, #151515)"/>
