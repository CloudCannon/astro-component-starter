<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t-feature-slider">
  <title id="t-feature-slider">Feature slider component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #151515;
        --pv-panel: #1D1D1B;
        --pv-surface: #232320;
        --pv-line: #2E2D29;
        --pv-glyph: #45443E;
        --pv-body: #3A3934;
        --pv-subject: #6E6A62;
        --pv-ink: #F5F3EE;
        --pv-on-ink: #6B6B6B;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 104)">
    <rect x="80" y="140" width="110" height="12" rx="6" fill="var(--pv-glyph, #CFCBC2)"/>
    <rect x="80" y="172" width="470" height="40" rx="20" fill="var(--pv-subject, #A8A398)"/>
    <rect x="80" y="232" width="520" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="80" y="256" width="520" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="80" y="280" width="330" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="850" y="0" width="350" height="440" rx="10" fill="var(--pv-surface, #EBE9E3)"/>
    <circle cx="1095" cy="141" r="21" fill="var(--pv-glyph, #CFCBC2)"/>
    <polygon points="932,333 996,240 1044,333" fill="var(--pv-glyph, #CFCBC2)" stroke="var(--pv-glyph, #CFCBC2)" stroke-width="20" stroke-linejoin="round"/>
    <polygon points="1024,335 1081,260 1135,335" fill="var(--pv-glyph, #CFCBC2)" stroke="var(--pv-glyph, #CFCBC2)" stroke-width="16" stroke-linejoin="round"/>
    <circle cx="550" cy="490" r="22" fill="var(--pv-glyph, #CFCBC2)"/>
    <polygon points="552,487 552,493 548,490" fill="var(--pv-paper, #FFFFFF)" stroke="var(--pv-paper, #FFFFFF)" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="616" cy="490" r="6" fill="var(--pv-subject, #A8A398)"/>
    <circle cx="640" cy="490" r="6" fill="var(--pv-surface, #EBE9E3)"/>
    <circle cx="664" cy="490" r="6" fill="var(--pv-surface, #EBE9E3)"/>
    <circle cx="730" cy="490" r="22" fill="var(--pv-glyph, #CFCBC2)"/>
    <polygon points="728,487 728,493 732,490" fill="var(--pv-paper, #FFFFFF)" stroke="var(--pv-paper, #FFFFFF)" stroke-width="6" stroke-linejoin="round"/>
