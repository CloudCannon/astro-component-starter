<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t-feature-split">
  <title id="t-feature-split">Feature split component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #151515;
        --pv-panel: #1D1D1B;
        --pv-surface: #232320;
        --pv-line: #2E2D29;
        --pv-glyph: #45443E;
        --pv-body: #3A3934;
        --pv-subject: #6E6A62;
        --pv-ink: #F5F3EE;
        --pv-on-ink: #6B6B6B;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 90)">
    <rect x="160" y="169" width="125" height="12" rx="6" fill="var(--pv-glyph, #CFCBC2)"/>
    <rect x="160" y="205" width="417" height="40" rx="20" fill="var(--pv-subject, #A8A398)"/>
    <rect x="160" y="267" width="437" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="160" y="291" width="241" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="160" y="327" width="104" height="44" rx="10" fill="var(--pv-ink, #151515)"/>
    <rect x="186" y="345" width="52" height="8" rx="4" fill="var(--pv-on-ink, #9A9A9A)"/>
    <rect x="277" y="327" width="104" height="44" rx="10" fill="var(--pv-paper, #FFFFFF)" stroke="var(--pv-glyph, #CFCBC2)" stroke-width="2"/>
    <rect x="303" y="345" width="52" height="8" rx="4" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="683" y="0" width="437" height="540" rx="10" fill="var(--pv-surface, #EBE9E3)"/>
    <circle cx="989" cy="173" r="25" fill="var(--pv-glyph, #CFCBC2)"/>
    <polygon points="785,409 865,293 925,409" fill="var(--pv-glyph, #CFCBC2)" stroke="var(--pv-glyph, #CFCBC2)" stroke-width="24" stroke-linejoin="round"/>
    <polygon points="900,411 971,319 1039,411" fill="var(--pv-glyph, #CFCBC2)" stroke="var(--pv-glyph, #CFCBC2)" stroke-width="20" stroke-linejoin="round"/>
