<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="t-stats">
  <title id="t-stats">Stats component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #151515;
        --pv-panel: #1D1D1B;
        --pv-surface: #232320;
        --pv-line: #2E2D29;
        --pv-glyph: #45443E;
        --pv-body: #3A3934;
        --pv-subject: #6E6A62;
        --pv-ink: #F5F3EE;
        --pv-on-ink: #6B6B6B;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="800" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 337)">
    <rect x="160" y="12" width="176" height="40" rx="20" fill="var(--pv-subject, #A8A398)"/>
    <rect x="160" y="78" width="110" height="8" rx="4" fill="var(--pv-on-ink, #9A9A9A)"/>
    <rect x="400" y="12" width="200" height="40" rx="20" fill="var(--pv-subject, #A8A398)"/>
    <rect x="400" y="78" width="96" height="8" rx="4" fill="var(--pv-on-ink, #9A9A9A)"/>
    <rect x="400" y="102" width="130" height="8" rx="4" fill="var(--pv-glyph, #CFCBC2)"/>
    <rect x="640" y="12" width="150" height="40" rx="20" fill="var(--pv-subject, #A8A398)"/>
    <rect x="640" y="78" width="120" height="8" rx="4" fill="var(--pv-on-ink, #9A9A9A)"/>
    <rect x="880" y="12" width="240" height="40" rx="20" fill="var(--pv-subject, #A8A398)"/>
    <rect x="880" y="78" width="128" height="8" rx="4" fill="var(--pv-on-ink, #9A9A9A)"/>
    <rect x="880" y="102" width="100" height="8" rx="4" fill="var(--pv-glyph, #CFCBC2)"/>
    <rect x="384" y="8" width="2" height="110" rx="1" fill="var(--pv-line, #E4E1DA)"/>
    <rect x="624" y="8" width="2" height="110" rx="1" fill="var(--pv-line, #E4E1DA)"/>
    <rect x="864" y="8" width="2" height="110" rx="1" fill="var(--pv-line, #E4E1DA)"/>
  </g>
</svg>
