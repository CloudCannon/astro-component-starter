<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t-hero-center">
  <title id="t-hero-center">Hero center component preview</title>
  <style>
    @media (prefers-color-scheme: dark) {
      svg {
        --pv-paper: #151515;
        --pv-panel: #1D1D1B;
        --pv-surface: #232320;
        --pv-line: #2E2D29;
        --pv-glyph: #45443E;
        --pv-body: #3A3934;
        --pv-subject: #6E6A62;
        --pv-ink: #F5F3EE;
        --pv-on-ink: #6B6B6B;
      }
    }
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="var(--pv-paper, #FFFFFF)"/>
  <g transform="translate(0 -40)">
    <rect x="577" y="296" width="127" height="16" rx="8" fill="var(--pv-glyph, #CFCBC2)"/>
    <rect x="313" y="328" width="654" height="40" rx="20" fill="var(--pv-subject, #A8A398)"/>
    <rect x="260" y="392" width="760" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="374" y="416" width="532" height="12" rx="6" fill="var(--pv-body, #DAD7D0)"/>
    <rect x="561" y="460" width="158" height="44" rx="10" fill="var(--pv-ink, #151515)"/>
    <rect x="606" y="478" width="68" height="8" rx="4" fill="var(--pv-on-ink, #9A9A9A)"/>
  </g>
</svg>
