<svg viewBox="0 0 1120 780" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pbBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf4ff"/>
      <stop offset="1" stop-color="#fafcff"/>
    </linearGradient>
    <linearGradient id="pbImg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#e9d5ff"/>
    </linearGradient>
    <pattern id="pbDots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.7" fill="#bfdbfe" opacity=".55"/>
    </pattern>
    <filter id="pbWindowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1e3a8a" flood-opacity=".14"/>
    </filter>
    <filter id="pbCardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1e3a8a" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect x="20" y="10" width="1080" height="752" rx="32" fill="url(#pbBg)"/>
