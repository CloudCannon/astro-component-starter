    </pattern>
    <clipPath id="sgImgClip"><rect x="376" y="268" width="324" height="92" rx="12"/></clipPath>
    <filter id="sgShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#3b0764" flood-opacity=".13"/>
    </filter>
    <filter id="sgChip" x="-30%" y="-60%" width="160%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#3b0764" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sgBg)"/>
