<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sgBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f0ff"/>
      <stop offset="1" stop-color="#fbfaff"/>
    </linearGradient>
    <linearGradient id="sgImg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#fce7f3"/>
    </linearGradient>
    <pattern id="sgDots" width="28" height="28" patternUnits="userSpaceOnUse">
