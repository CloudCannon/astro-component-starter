<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="spBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf3"/>
      <stop offset="1" stop-color="#f8fdfa"/>
    </linearGradient>
    <linearGradient id="spImg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#dcfce7"/>
    </linearGradient>
    <pattern id="spDots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.7" fill="#bbf7d0" opacity=".6"/>
    </pattern>
    <clipPath id="spImgClip"><rect x="110" y="250" width="290" height="150" rx="12"/></clipPath>
    <filter id="spShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#14532d" flood-opacity=".13"/>
    </filter>
    <filter id="spChip" x="-30%" y="-60%" width="160%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#14532d" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#spBg)"/>
  <rect width="800" height="600" fill="url(#spDots)"/>

  <!-- the live site -->
  <g filter="url(#spShadow)">
    <rect x="70" y="60" width="620" height="440" rx="18" fill="#fff"/>
  </g>
  <rect x="70" y="60" width="620" height="440" rx="18" fill="none" stroke="#e3ece6"/>
  <path d="m70 106h620" stroke="#e3ece6"/>
  <circle cx="100" cy="83" r="6.5" fill="#f87171"/>
  <circle cx="121" cy="83" r="6.5" fill="#facc15"/>
  <circle cx="142" cy="83" r="6.5" fill="#4ade80"/>
  <rect x="230" y="71" width="300" height="24" rx="12" fill="#f1f5f2"/>
  <rect x="250" y="78" width="8" height="8" rx="2" fill="#16a34a"/>
  <path d="m251 78v-2a3 3 0 0 1 6 0v2" fill="none" stroke="#16a34a" stroke-width="1.6"/>
  <rect x="268" y="79" width="120" height="8" rx="4" fill="#9ca3af"/>

  <rect x="110" y="136" width="84" height="12" rx="6" fill="#dbeafe"/>
  <rect x="110" y="160" width="290" height="26" rx="8" fill="#2a2a2a"/>
  <rect x="110" y="196" width="220" height="11" rx="5.5" fill="#e8eaef"/>
  <rect x="110" y="216" width="180" height="11" rx="5.5" fill="#e8eaef"/>
  <rect x="110" y="250" width="290" height="150" rx="12" fill="url(#spImg)"/>
  <g clip-path="url(#spImgClip)">
    <circle cx="160" cy="290" r="14" fill="#fff" opacity=".85"/>
    <path d="m110 400 96-70 70 46 54-34 70 40v18h-290z" fill="#fff" opacity=".6"/>
  </g>
  <rect x="110" y="424" width="112" height="34" rx="9" fill="#2563eb"/>
  <rect x="138" y="436" width="56" height="9" rx="4.5" fill="#fff" opacity=".9"/>

  <rect x="430" y="136" width="220" height="11" rx="5.5" fill="#e8eaef"/>
  <rect x="430" y="158" width="190" height="11" rx="5.5" fill="#e8eaef"/>
  <rect x="430" y="180" width="205" height="11" rx="5.5" fill="#e8eaef"/>

  <!-- the review that signed it off -->
  <g filter="url(#spChip)">
    <rect x="420" y="216" width="320" height="150" rx="16" fill="#fff"/>
  </g>
  <rect x="420" y="216" width="320" height="150" rx="16" fill="none" stroke="#e3ece6"/>
  <circle cx="456" cy="252" r="18" fill="#fde68a"/>
  <rect x="486" y="240" width="90" height="10" rx="5" fill="#2a2a2a"/>
  <rect x="486" y="258" width="60" height="8" rx="4" fill="#c3c9d4"/>
  <rect x="628" y="236" width="92" height="30" rx="15" fill="#dcfce7"/>
  <circle cx="646" cy="251" r="8" fill="#16a34a"/>
  <path d="m642 251 3 3 5-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="660" y="247" width="46" height="8" rx="4" fill="#15803d"/>
  <rect x="440" y="290" width="280" height="10" rx="5" fill="#e8eaef"/>
  <rect x="440" y="310" width="240" height="10" rx="5" fill="#e8eaef"/>
  <rect x="440" y="330" width="150" height="10" rx="5" fill="#e8eaef"/>

  <!-- published -->
  <g filter="url(#spChip)">
    <rect x="410" y="420" width="330" height="72" rx="36" fill="#16a34a"/>
  </g>
  <circle cx="452" cy="456" r="20" fill="#fff" opacity=".2"/>
  <g fill="none" stroke="#fff" stroke-width="2.2">
