  </g>
  <rect x="486" y="442" width="110" height="11" rx="5.5" fill="#fff"/>
  <rect x="486" y="461" width="150" height="8" rx="4" fill="#fff" opacity=".7"/>
  <circle cx="704" cy="456" r="16" fill="#fff"/>
  <path d="m697 456 5 5 9-10" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
