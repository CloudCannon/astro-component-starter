text:
  type: text
  comment: Button text. Still required with Hide Text on, as the accessible name.
link:
  type: url
  comment: The URL to which the button should link.
iconName:
  type: select
  comment: Icon to display, from [Heroicons](https://heroicons.com/).
  options:
    values: data.icons
    preview:
      text:
        - key: name
      image:
        - template: src/icons/{id}.svg
iconColor:
  type: select
  comment: The color of the icon.
  hidden: "!iconName"
  options:
    values:
      - id: default
        name: Default
      - id: blue
        name: Blue
      - id: green
        name: Green
      - id: yellow
        name: Yellow
      - id: orange
        name: Orange
      - id: red
        name: Red
      - id: purple
        name: Purple
      - id: pink
        name: Pink
      - id: cyan
        name: Cyan
iconPosition:
  type: select
  comment: The position of the icon relative to the text.
  hidden: "!iconName"
  options:
    values:
      - id: before
        name: Before
      - id: after
        name: After
hideText:
  type: switch
  hidden: "!iconName"
  comment: Shows only the icon and hides the text.
variant:
  type: select
  comment: The presentation of the button.
  options:
    values:
      - id: primary
        name: Primary
      - id: secondary
        name: Secondary
      - id: tertiary
        name: Tertiary
      - id: ghost
        name: Ghost
      - id: text
        name: Text
size:
  type: select
  comment: The size of the button.
  options:
    values:
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
