paddingVertical:
  comment: The space on the top and bottom of the horizontal line.
  type: select
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
lineStyle:
  comment: Whether the line is solid, dashed or dotted.
  type: select
  options:
    values:
      - id: solid
        name: Solid
      - id: dashed
        name: Dashed
      - id: dotted
        name: Dotted
