html:
  type: code
  comment: Trusted HTML to embed, such as a map, form, calendar or podcast share code. Scripts are removed, and iframes must use HTTPS. Video suits YouTube better.
  options:
    syntax: html
aspectRatio:
  type: select
  comment: The aspect ratio of the embed.
  options:
    values:
      - id: square
        name: Square (1:1)
      - id: landscape
        name: Landscape (4:3)
      - id: portrait
        name: Portrait (3:4)
      - id: widescreen
        name: Widescreen (16:9)
      - id: none
        name: None (the embed sets its own height)
