text:
  type: markdown
  comment: Quotation marks will be added around the text.
  options:
    blockquote: false
    bold: true
    format:
    italic: true
    link: true
    strike: false
    subscript: true
    superscript: true
    underline: false
    bulletedlist: false
    numberedlist: false
authorName:
  comment: The person to whom you're attributing the quotation.
  type: textarea
authorDescription:
  comment: The role or company of the person.
  type: textarea
authorImage:
  comment: The image of the author.
  type: image
  options:
    paths:
      uploads: src/assets/images
      static: ""
    resize_style: cover
    width: 480
    height: 480
avatarSize:
  comment: Diameter of the author photo in pixels. The image is requested at this size, so shrink it for dense layouts rather than scaling it down in CSS.
  type: number
  options:
    step: 4
    min: 24
    max: 160
alignmentHorizontal:
  comment: The horizontal alignment of the testimonial.
  type: select
  options:
    values:
      - id: start
        name: Start
      - id: center
        name: Center
