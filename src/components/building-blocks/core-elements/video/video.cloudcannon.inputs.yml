type:
  type: select
  options:
    values:
      - id: youtube
        name: YouTube
      - id: vimeo
        name: Vimeo
      - id: local-source
        name: Local Source
title:
  type: text
  hidden: source
  comment: Accessible title for the YouTube or Vimeo video.
videoId:
  type: text
  hidden: source
  comment: YouTube or Vimeo video ID.
source:
  type: file
  hidden: videoId
  label: Video Source
  comment: Self-hosted video file. Same-named files in other formats are added automatically.
  options:
    accepts_mime_types:
      - video/mp4
      - video/webm
      - video/ogg
    paths:
      uploads: public/videos
      static: public
autoplay:
  type: switch
  comment: Plays automatically, muted. YouTube and Vimeo load when scrolled into view.
loop:
  type: switch
  comment: Restart the video from the beginning when it ends.
captions:
  type: file
  hidden: "!source"
  label: Captions
  comment: WebVTT (.vtt) captions for a self-hosted video, shown by default.
  options:
    paths:
      uploads: public/videos
      static: public
captionsLanguage:
  type: text
  hidden: "!captions"
  comment: Language tag for the captions, e.g. en or fr-CA.
thumbnail:
  type: image
  hidden: "!source"
  comment: Poster image shown before a self-hosted video plays.
  options:
    accepts_mime_types:
      - image/jpeg
      - image/png
      - image/webp
    paths:
      uploads: src/assets/images
      static: ""
    resize_style: contain
    width: 1920
    height: 1080
