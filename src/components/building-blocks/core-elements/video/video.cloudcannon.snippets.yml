video:
  template: mdx_component
  inline: false
  preview:
    text:
      - template: Video - {type}
      - Video
    subtext:
      - key: title
    image: public/component-previews/building-blocks/core-elements/video.svg
    icon: videocam
    gallery:
      image: public/component-previews/building-blocks/core-elements/video.svg
  definitions:
    component_name: Video
    named_args:
      - editor_key: type
        type: string
        optional: true
        remove_empty: true
      - editor_key: title
        type: string
        optional: true
        remove_empty: true
      - editor_key: videoId
        type: string
        optional: true
        remove_empty: true
      - editor_key: source
        type: string
        optional: true
        remove_empty: true
      - editor_key: autoplay
        type: boolean
        optional: true
      - editor_key: loop
        type: boolean
        optional: true
      - editor_key: thumbnail
        type: string
        optional: true
        remove_empty: true
  _inputs_from_glob:
    - /src/components/building-blocks/core-elements/video/video.cloudcannon.inputs.yml
