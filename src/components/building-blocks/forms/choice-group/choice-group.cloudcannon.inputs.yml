title:
  type: text
  comment: Title text for the fieldset.
name:
  type: text
  comment: Name the choices are submitted under. Must be unique in the form.
  options:
    required: true
    required_message: Only form elements with a name will have their values passed when submitting a form.
hint:
  type: text
  comment: Help text shown between the title and the options.
error:
  type: text
  comment: Validation message shown below the options. Also marks the group invalid.
required:
  type: switch
  comment: Whether the field is required.
options:
  type: array
  comment: Array of choice options with value, label, and checked state.
  options:
    structures: _structures.choiceOptions
    min_items: 1
    min_items_message: At least one option is required.
orientation:
  type: select
  comment: Stacks the options vertically or lays them out in a grid.
  options:
    values:
      - id: vertical
        name: Vertical
      - id: horizontal
        name: Horizontal
multiple:
  type: switch
  comment: Allows more than one choice, using checkboxes instead of radio buttons.
