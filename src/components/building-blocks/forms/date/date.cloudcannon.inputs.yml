label:
  type: text
  comment: The label text for the date field.
name:
  type: text
  comment: The name attribute for the date field.
required:
  type: switch
  comment: Whether the field is required.
value:
  type: date
  comment: The default value for the date field. Only the date part is used; any time is dropped.
min:
  type: date
  comment: The earliest date that can be chosen.
max:
  type: date
  comment: The latest date that can be chosen.
hint:
  type: text
  comment: Optional help text shown between the label and the field, announced to assistive technology.
autocomplete:
  type: select
  options:
    values: data.autocomplete_tokens
    value_key: id
    allow_create: true
    preview:
      text:
        - key: name
      subtext:
        - key: id
  comment: Autofill hint for browsers and password managers (WCAG 1.3.5). Leave blank to derive one from the field's type and name. Compound tokens such as `shipping street-address` can be typed in.
