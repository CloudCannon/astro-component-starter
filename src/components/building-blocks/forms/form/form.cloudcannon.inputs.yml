action:
  type: url
  comment: URL that receives the form submission.
method:
  type: select
  comment: How the form is sent. Use POST unless it's a search or filter that should be linkable.
  options:
    values:
      - id: post
        name: POST
      - id: get
        name: GET
honeypotName:
  type: text
  comment: Name of a hidden spam-trap field. Your endpoint must reject submissions that fill it.
successMessage:
  type: text
  comment: Message shown when the URL has `?success`. Point your endpoint's redirect there.
formBlocks:
  type: array
  comment: Form fields and buttons inside the form.
  options:
    structures: _structures.formBlocks
