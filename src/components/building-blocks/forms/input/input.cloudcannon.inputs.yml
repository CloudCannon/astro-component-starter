label:
  type: text
  comment: The label text for the input field.
name:
  type: text
  comment: Name the field is submitted under. Must be unique in the form.
type:
  type: select
  options:
    values:
      - text
      - email
      - password
      - tel
      - url
      - number
  comment: The input type.
placeholder:
  type: text
  comment: Placeholder text for the input field.
required:
  type: switch
  comment: Whether the field is required.
value:
  type: text
  comment: The default value for the input field.
hint:
  type: text
  comment: Help text shown between the label and the field.
autocomplete:
  type: select
  options:
    values: data.autocomplete_tokens
    value_key: id
    allow_create: true
    preview:
      text:
        - key: name
      subtext:
        - key: id
  comment: Autofill hint for browsers. Leave blank to derive it from the field's type and name.
iconName:
  type: select
  comment: Icon to display, from [Heroicons](https://heroicons.com/).
  options:
    values: data.icons
    preview:
      text:
        - key: name
      image:
        - template: src/icons/{id}.svg
iconColor:
  type: select
  comment: The color of the icon.
  hidden: "!iconName"
  options:
    values:
      - id: default
        name: Default
      - id: blue
        name: Blue
      - id: green
        name: Green
      - id: yellow
        name: Yellow
      - id: orange
        name: Orange
      - id: red
        name: Red
      - id: purple
        name: Purple
      - id: pink
        name: Pink
      - id: cyan
        name: Cyan
iconPosition:
  type: select
  comment: The position of the icon relative to the input field.
  hidden: "!iconName"
  options:
    values:
      - id: before
        name: Before
      - id: after
        name: After
