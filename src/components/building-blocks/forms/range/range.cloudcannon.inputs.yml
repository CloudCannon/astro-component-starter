label:
  type: text
  comment: The label text for the range field.
name:
  type: text
  comment: Name the field is submitted under. Must be unique in the form.
min:
  type: number
  comment: The minimum value of the range.
max:
  type: number
  comment: The maximum value of the range.
step:
  type: number
  comment: The step increment between values.
value:
  type: number
  comment: The default value for the range field.
unit:
  type: text
  comment: Unit suffix shown next to the value, e.g. % or px.
showValue:
  type: switch
  comment: Shows the current value next to the label.
hint:
  type: text
  comment: Help text shown between the label and the field.
tickStyle:
  type: select
  comment: How the decorative scale marks below the track behave.
  options:
    values:
      - id: uniform
        name: Uniform
      - id: nearest
        name: Highlight nearest
      - id: none
        name: Hidden
tickCount:
  type: number
  comment: Number of decorative scale marks below the track.
