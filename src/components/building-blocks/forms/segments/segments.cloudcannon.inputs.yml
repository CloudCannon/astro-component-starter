title:
  type: text
  comment: Title text for the fieldset.
name:
  type: text
  comment: Name the choices are submitted under. Must be unique in the form.
  options:
    required: true
    required_message: Only form elements with a name will have their values passed when submitting a form.
required:
  type: switch
  comment: Whether the field is required.
options:
  type: array
  comment: Array of segment options with value, label, icon, and checked state.
  options:
    structures: _structures.segmentOptions
    min_items: 1
    min_items_message: At least one option is required.
iconOnly:
  type: switch
  comment: Hides the labels and shows them as tooltips instead.
multiple:
  type: switch
  comment: Allows more than one choice, using checkboxes instead of radio buttons.
keepStateOnRefresh:
  type: switch
  comment: Lets the browser keep the selection after a page refresh.
