label:
  type: text
  comment: The label text for the textarea field.
name:
  type: text
  comment: Name the field is submitted under. Must be unique in the form.
  options:
    required: true
    required_message: Only form elements with a name will have their values passed when submitting a form.
required:
  type: switch
  comment: Whether the field is required.
placeholder:
  type: text
  comment: Placeholder text for the textarea field.
value:
  type: text
  comment: The default value for the textarea field.
rows:
  type: number
  comment: How many lines of text the field shows before it scrolls.
  options:
    step: 1
    min: 1
    max: 20
hint:
  type: text
  comment: Help text shown between the label and the field.
autocomplete:
  type: select
  options:
    values: data.autocomplete_tokens
    value_key: id
    allow_create: true
    preview:
      text:
        - key: name
      subtext:
        - key: id
  comment: Autofill hint for browsers. Leave blank to derive it from the field's type and name.
