label:
  comment: Names this block in the editor and sets its anchor id.
  type: text
items:
  comment: The items to display in the accordion.
  type: array
  options:
    structures: _structures.accordionItems
openFirst:
  comment: Opens the first item by default.
  type: switch
singleOpen:
  comment: Allows only one item open at a time.
  type: switch
