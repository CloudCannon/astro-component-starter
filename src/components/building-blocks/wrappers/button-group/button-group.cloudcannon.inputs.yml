label:
  comment: Names this block in the editor and sets its anchor id.
  type: text
buttonSections:
  type: array
  comment: Buttons in the group.
  options:
    structures: _structures.buttonSections
direction:
  comment: Direction of button layout.
  type: select
  options:
    values:
      - id: row
        name: Row
      - id: column
        name: Column
alignmentHorizontal:
  comment: Horizontal alignment of the buttons.
  type: select
  options:
    values:
      - id: start
        name: Start
      - id: center
        name: Center
      - id: end
        name: End
