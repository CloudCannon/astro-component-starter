label:
  type: text
  comment: Names this block in the editor and sets its anchor id.
contentSections:
  type: array
  comment: Card body content, inside the padding.
  options:
    structures: _structures.cardSections
beforeContentSections:
  type: array
  comment: Content above the card body, outside the padding.
  hidden: "!showBeforeAfter"
  options:
    structures: _structures.cardSections
afterContentSections:
  type: array
  comment: Content below the card body, outside the padding.
  hidden: "!showBeforeAfter"
  options:
    structures: _structures.cardSections
maxContentWidth:
  type: select
  comment: Maximum width of the content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
showBeforeAfter:
  type: switch
  label: Show Before / After Content Sections
  comment: Shows content areas above and below the card body, outside the padding.
paddingHorizontal:
  type: select
  comment: Horizontal padding around the content.
  options:
    values:
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
paddingVertical:
  type: select
  comment: Vertical padding around the content.
  options:
    values:
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
colorScheme:
  type: select
  comment: Light or dark scheme for the card. Inherit follows its container.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
lockColorScheme:
  type: switch
  label: Lock color scheme
  comment: Ignores the site theme toggle. Only applies when Color Scheme is Light or Dark.
backgroundColor:
  type: select
  comment: Background color for the card.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
background:
  type: object
  comment: An image, video, or tiled pattern behind the content.
  options:
    preview:
      icon: wallpaper
      text:
        - Background
      subtext:
        - key: type
    structures:
      id_key: type
      reorder_inputs: true
      remove_extra_inputs: true
      values:
        - label: Image
          icon: image
          value:
            type: image
            imageSource: ""
            imageAlt: ""
            positionVertical: top
            positionHorizontal: center
            fixed: false
            priority: false
            overlay: 0
        - label: Video
          icon: videocam
          value:
            type: video
            videoSource: ""
            positionVertical: top
            positionHorizontal: center
            overlay: 0
        - label: Pattern
          icon: texture
          value:
            type: pattern
            imageSource: ""
            patternSize: natural
            overlay: 0
background.type:
  type: select
  label: Background type
  comment: A cover image, a muted autoplay video, or a repeating tiled pattern.
  options:
    values:
      - id: image
        name: Image
      - id: video
        name: Video
      - id: pattern
        name: Pattern
background.positionVertical:
  comment: Vertical focal point.
  type: select
  options:
    values:
      - id: top
        name: Top
      - id: center
        name: Center
      - id: bottom
        name: Bottom
background.positionHorizontal:
  comment: Horizontal focal point.
  type: select
  options:
    values:
      - id: left
        name: Left
      - id: center
        name: Center
      - id: right
        name: Right
background.fixed:
  type: switch
  label: Fixed background (parallax)
  comment: Pins the image in place while the page scrolls past.
background.priority:
  type: switch
  label: Prioritize image load
  comment: Loads the image eagerly. Use near the top of the page.
background.imageSource:
  comment: URL or path to the background or pattern image.
  type: image
  options:
    paths:
      uploads: src/assets/images
      static: ""
    resize_style: contain
    width: 1920
    height: 1280
background.patternSize:
  type: select
  label: Pattern tile size
  comment: Size of each repeated tile. Natural uses the image's own size.
  options:
    values:
      - id: natural
        name: Natural
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
background.imageAlt:
  comment: Alt text for the background image.
  type: text
background.videoSource:
  type: file
  label: Video source
  comment: Video file in public/videos. Same-named files in other formats are added too.
  options:
    accepts_mime_types:
      - video/mp4
      - video/webm
      - video/ogg
    paths:
      uploads: public/videos
      static: public
background.overlay:
  type: range
  comment: Tints the background. -1 darkens, 1 lightens.
  options:
    min: -1
    max: 1
    step: 0.1
link:
  type: url
  comment: URL to make the entire card clickable. Leave empty for a non-clickable card.
rounded:
  type: switch
  comment: Rounds the card's corners.
border:
  type: switch
  comment: Adds a border to the card.
