label:
  comment: Names this block in the editor and for screen readers. Sets its anchor id.
  type: text
slides:
  comment: Slides in the carousel.
  type: array
  options:
    structures: _structures.slides
autoPlay:
  comment: Advances slides automatically.
  type: switch
pauseOnHover:
  comment: Pauses auto-play on hover. Only applies when Auto Play is on.
  type: switch
autoScroll:
  comment: Scrolls slides continuously like a marquee. Hides arrows and indicators.
  type: switch
loop:
  comment: Loop the carousel back to the beginning when reaching the end.
  type: switch
showIndicators:
  comment: Show dot indicators below the carousel.
  type: switch
indicatorStyle:
  comment: Dots, a slide counter, or image thumbnails.
  type: select
  options:
    values:
      - dots
      - fraction
      - thumbnails
showArrows:
  comment: Show previous and next arrow buttons.
  type: switch
alignmentHorizontal:
  comment: Alignment of slides within the carousel viewport.
  type: select
  options:
    values:
      - start
      - center
      - end
slidesToScroll:
  comment: Slides to move per step. Auto moves one full view.
  type: select
  options:
    values:
      - auto
      - "1"
      - "2"
      - "3"
      - "4"
slideWidthPercent:
  comment: Width of each slide as a percentage of the carousel.
  type: range
  options:
    min: 10
    max: 100
    step: 1
minSlideWidth:
  comment: Minimum slide width in pixels.
  type: number
gap:
  comment: The gap between slides. Only visible when slides are narrower than the viewport.
  type: select
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
