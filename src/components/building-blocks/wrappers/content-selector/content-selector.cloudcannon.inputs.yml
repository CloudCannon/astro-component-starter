label:
  comment: Names this block in the editor and for screen readers. Sets its anchor id.
  type: text
items:
  type: array
  comment: The tabs to switch between. Each item is one tab and the panel it shows.
  options:
    structures: _structures.contentSelectorItems
navigationPosition:
  type: select
  comment: Where the tabs sit. Both collapse to an accordion on small screens.
  options:
    values:
      - id: start
        name: Start
      - id: top
        name: Top
