label:
  comment: Names this block in the editor and sets its anchor id.
  type: text
columns:
  comment: Columns from 640px up; one below. Auto fits as many items as space allows.
  type: select
  options:
    values:
      - id: auto
        name: Auto
      - id: "2"
        name: "2"
      - id: "3"
        name: "3"
      - id: "4"
        name: "4"
      - id: "5"
        name: "5"
      - id: "6"
        name: "6"
minItemWidth:
  comment: Minimum item width in pixels. Auto columns only.
  type: number
maxItemWidth:
  comment: Maximum item width in pixels; empty lets items stretch. Auto columns only.
  type: number
items:
  label: Grid Items
  comment: Grid items, each holding content blocks.
  type: array
  options:
    structures: _structures.gridItems
gap:
  comment: The gap between grid items.
  type: select
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
