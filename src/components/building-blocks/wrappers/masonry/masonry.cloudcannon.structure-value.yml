label: Masonry
icon: view_quilt
description: Column layout for mixed-height items that keeps reading order.
value:
  _component: building-blocks/wrappers/masonry
  label: ""
  columns: 3
  gap: md
  items:
    - contentSections:
        - _component: building-blocks/wrappers/card
          border: true
          rounded: true
          paddingHorizontal: md
          paddingVertical: md
          contentSections:
            - _component: building-blocks/core-elements/heading
              text: Fast by default
              level: h3
              size: xs
            - _component: building-blocks/core-elements/text
              text: Static pages, optimized images, no client JavaScript unless a component asks for it.
    - contentSections:
        - _component: building-blocks/wrappers/card
          border: true
          rounded: true
          paddingHorizontal: md
          paddingVertical: md
          contentSections:
            - _component: building-blocks/core-elements/heading
              text: Brandable in one file
              level: h3
              size: xs
            - _component: building-blocks/core-elements/text
              text: Every color, radius, and font resolves through a design token, so a client theme is a token swap and nothing else. Change the file once and the whole library follows — no per-component edits.
    - contentSections:
        - _component: building-blocks/wrappers/card
          border: true
          rounded: true
          paddingHorizontal: md
          paddingVertical: md
          contentSections:
            - _component: building-blocks/core-elements/heading
              text: Visually editable
              level: h3
              size: xs
            - _component: building-blocks/core-elements/text
              text: Editors build pages from the component library in CloudCannon.
    - contentSections:
        - _component: building-blocks/wrappers/card
          border: true
          rounded: true
          paddingHorizontal: md
          paddingVertical: md
          contentSections:
            - _component: building-blocks/core-elements/heading
              text: Documented as it grows
              level: h3
              size: xs
            - _component: building-blocks/core-elements/text
              text: Every component ships with a reference page, live examples, and a props table generated from the same files the editor reads.
    - contentSections:
        - _component: building-blocks/wrappers/card
          border: true
          rounded: true
          paddingHorizontal: md
          paddingVertical: md
          contentSections:
            - _component: building-blocks/core-elements/heading
              text: Tested end to end
              level: h3
              size: xs
            - _component: building-blocks/core-elements/text
              text: Rendering, linting, and headless-browser smoke tests run on every check.
    - contentSections:
        - _component: building-blocks/wrappers/card
          border: true
          rounded: true
          paddingHorizontal: md
          paddingVertical: md
          contentSections:
            - _component: building-blocks/core-elements/heading
              text: Accessible
              level: h3
              size: xs
            - _component: building-blocks/core-elements/text
              text: Keyboard, focus, and screen-reader behavior are part of each component's definition of done, not an afterthought.
