label:
  type: text
  comment: Names this block in the editor and for screen readers. Sets its anchor id.
cards:
  type: array
  label: Cards
  comment: Cards in the deck. Each slides up over the one before it.
  options:
    structures: _structures.scrollDeckCards
stickyOffset:
  type: select
  label: Sticky offset
  comment: Extra gap between the site header and the pinned card.
  options:
    values:
      - id: none
        name: None
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
cardColorScheme:
  type: select
  label: Card color scheme
  comment: Light or dark scheme for the cards. Inherit follows the section.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
showRail:
  type: switch
  label: Show card rail
  comment: Anchor links marking the card on top. Hidden on small screens.
