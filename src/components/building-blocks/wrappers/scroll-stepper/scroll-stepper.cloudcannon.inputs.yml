label:
  type: text
  comment: Optional label for the scroll stepper to help identify it in the editor.
steps:
  type: array
  label: Steps
  comment: Each step scrolls through its own message while its media state is shown beside it.
  options:
    structures: _structures.scrollStepperSteps
mediaWidth:
  type: select
  label: Media width
  comment: How much of the row the sticky media column takes on desktop.
  options:
    values:
      - id: half
        name: Half
      - id: wide
        name: Wide
      - id: narrow
        name: Narrow
reverse:
  type: switch
  comment: Put the sticky media column on the end side on desktop. Narrow layouts pair each image with its message.
mediaAspectRatio:
  type: select
  label: Media canvas ratio
  comment: A preferred minimum canvas for each media panel. Panels grow when their content needs more room.
  options:
    values:
      - id: none
        name: Natural
      - id: square
        name: Square
      - id: landscape
        name: Landscape (4:3)
      - id: portrait
        name: Portrait (3:4)
      - id: widescreen
        name: Widescreen (16:9)
progressStyle:
  type: select
  label: Progress indicator
  comment: A bar or dots below the sticky media. Hidden on mobile.
  options:
    values:
      - id: bar
        name: Bar
      - id: dots
        name: Dots
      - id: none
        name: None
stepHeight:
  type: select
  label: Scroll state height
  comment: Content is the shorter default (about a third of a viewport); Screen gives each media state a full viewport interval.
  options:
    values:
      - id: screen
        name: Screen
      - id: content
        name: Content
gap:
  type: select
  comment: Space between the sticky media and scrolling content on desktop.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
