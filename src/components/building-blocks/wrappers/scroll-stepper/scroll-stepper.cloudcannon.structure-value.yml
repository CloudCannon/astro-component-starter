  stepHeight: content
  gap: 2xl
  spaceBefore: default
preview:
  text:
    - Scroll Stepper
  subtext:
    - key: label
  image: public/component-previews/building-blocks/wrappers/scroll-stepper.svg
  icon: view_day
  gallery:
    image: public/component-previews/building-blocks/wrappers/scroll-stepper.svg
    fit: cover
picker_preview:
  text: Scroll Stepper
  subtext: Scrolling messages with sticky media that changes for each step.
  image: public/component-previews/building-blocks/wrappers/scroll-stepper.svg
  gallery:
    image: public/component-previews/building-blocks/wrappers/scroll-stepper.svg
    fit: cover
_inputs_from_glob:
  - /src/components/building-blocks/wrappers/scroll-stepper/scroll-stepper.cloudcannon.inputs.yml
  - /.cloudcannon/inputs/space-before.yml
_structures:
  scrollStepperSteps:
    values:
      - label: Step
        icon: view_day
        value:
          _component: building-blocks/wrappers/scroll-stepper/scroll-stepper-step
          mediaSections: []
          contentSections: []
        preview:
          text:
            - Step
          subtext:
            - Add content and media
        _inputs:
          mediaSections:
            type: array
            label: Media
            comment: Content shown for this scroll state. Narrow layouts place it directly before its matching message.
            options:
              structures: _structures.scrollStepperSections
          contentSections:
            type: array
            label: Content
            comment: The message for this step. It scrolls beside the pinned media on desktop.
            options:
              structures: _structures.scrollStepperSections
