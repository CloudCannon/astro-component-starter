          rounded: true
          aspectRatio: landscape
      contentSections:
        - _component: building-blocks/core-elements/simple-text
          text: Step two
          size: sm
        - _component: building-blocks/core-elements/heading
          text: Make it yours
          level: h3
          size: lg
        - _component: building-blocks/core-elements/text
          text: Set the brand, arrange the content, and share a preview with the people reviewing it.
    - _component: building-blocks/wrappers/scroll-stepper/scroll-stepper-step
      mediaSections:
        - _component: building-blocks/core-elements/image
          source: /src/assets/images/component-docs/quiet-street.jpg
          alt: A quiet residential street
          rounded: true
          aspectRatio: landscape
      contentSections:
        - _component: building-blocks/core-elements/simple-text
          text: Step three
          size: sm
        - _component: building-blocks/core-elements/heading
          text: Publish with confidence
          level: h3
          size: lg
