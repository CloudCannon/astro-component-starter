label:
  comment: Names this block in the editor and sets its anchor id.
  type: text
firstColumnContentSections:
  type: array
  comment: Content blocks in the first column.
  options:
    structures: _structures.splitSections
secondColumnContentSections:
  type: array
  comment: Content blocks in the second column.
  options:
    structures: _structures.splitSections
distributionMode:
  comment: Predefined distribution mode for both columns.
  type: select
  options:
    values:
      - id: quarter-three-quarters
        name: Quarter-Three-Quarters
      - id: third-two-thirds
        name: Third-Two-Thirds
      - id: half
        name: Half
      - id: two-thirds-third
        name: Two-Thirds-Third
      - id: three-quarters-quarter
        name: Three-Quarters-Quarter
      - id: fixed-flexible
        name: Fixed-Flexible
      - id: flexible-fixed
        name: Flexible-Fixed
fixedWidth:
  comment: Width of the fixed column in pixels. Fixed-Flexible and Flexible-Fixed only.
  type: number
minSplitWidth:
  comment: Minimum width in pixels before switching to mobile layout.
  type: number
alignmentVertical:
  comment: Vertical alignment of the columns.
  type: select
  options:
    values:
      - id: top
        name: Top
      - id: center
        name: Center
      - id: bottom
        name: Bottom
      - id: stretch
        name: Stretch
reverse:
  comment: Swaps the order of the columns.
  type: switch
reverseOrderOnMobile:
  hidden: "!reverse"
  comment: Restores the original column order when the split stacks on mobile.
  type: switch
gap:
  comment: The gap between the two columns.
  type: select
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
