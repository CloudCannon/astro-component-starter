label:
  comment: Optional label to identify this stack in the editor.
  type: text
contentSections:
  type: array
  comment: Blocks laid out with one even gap between them.
  options:
    structures: _structures.stackSections
direction:
  comment: Lay children out vertically (column) or side by side (row).
  type: select
  options:
    values:
      - id: column
        name: Column
      - id: row
        name: Row
distribution:
  comment: How a row shares its width. Content sizes children to their content; Equal gives every child the same width (needed for cards or mixed blocks, which have no width of their own in a row). For many uniform items, use Grid instead — Equal is for a few different blocks.
  type: select
  options:
    values:
      - id: content
        name: Content
      - id: equal
        name: Equal
gap:
  comment: The gap between children.
  type: select
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
alignmentHorizontal:
  comment: Horizontal alignment of children.
  type: select
  options:
    values:
      - id: start
        name: Start
      - id: center
        name: Center
      - id: end
        name: End
alignmentVertical:
  comment: Vertical alignment of children.
  type: select
  options:
    values:
      - id: start
        name: Start
      - id: center
        name: Center
      - id: end
        name: End
      - id: stretch
        name: Stretch
wrap:
  comment: Allow a row to wrap onto new lines when it runs out of space.
  type: switch
stackOnMobile:
  comment: Stack a row vertically on small screens.
  type: switch
