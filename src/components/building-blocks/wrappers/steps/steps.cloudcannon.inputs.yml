label:
  comment: Optional label for the steps list to help identify it in the editor.
  type: text
items:
  type: array
  label: Steps
  comment: The steps, in order. Three to five, kept to similar length. Images are optional but all-or-none.
  options:
    structures: _structures.stepsItems
orientation:
  type: select
  comment: Columns with a connector on each marker, or a vertical sequence. Columns fall back to the vertical layout on small screens.
  options:
    values:
      - id: vertical
        name: Vertical
      - id: horizontal
        name: Horizontal
imageAspectRatio:
  type: select
  comment: Shared crop for every step's featured image. The designed default is landscape (4:3).
  options:
    values:
      - id: landscape
        name: Landscape (4:3)
      - id: portrait
        name: Portrait (3:4)
      - id: square
        name: Square (1:1)
      - id: widescreen
        name: Widescreen (16:9)
