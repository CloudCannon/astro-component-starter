label: Timeline
icon: timeline
description: Dated sequence of events on a rail.
value:
  _component: building-blocks/wrappers/timeline
  label: ""
  layout: vertical
  entries:
    - date: "2019"
      title: Founded
      body: Opened the studio and shipped the first client project.
    - date: "2022"
      title: First hires
      body: The team grew to eight and moved into a permanent office.
    - date: "2025"
      title: New markets
      body: Took on the first clients outside the country.
preview:
  text:
    - Timeline
  subtext:
    - key: label
  image: public/component-previews/building-blocks/wrappers/timeline.svg
  icon: timeline
  gallery:
    image: public/component-previews/building-blocks/wrappers/timeline.svg
    fit: cover
picker_preview:
  text: Timeline
  subtext: A dated sequence on a rail. Vertical, split, or horizontal.
  image: public/component-previews/building-blocks/wrappers/timeline.svg
  gallery:
    image: public/component-previews/building-blocks/wrappers/timeline.svg
    fit: cover
_inputs_from_glob:
  - /src/components/building-blocks/wrappers/timeline/timeline.cloudcannon.inputs.yml
  - /.cloudcannon/inputs/space-before.yml
_structures:
  timelineEntries:
    values:
      - label: Entry
        icon: timeline
        value:
          year: ""
          date: "2024"
          title: Entry title
          body: ""
          iconName: ""

        preview:
          text:
            - key: title
            - Entry
          subtext:
            - key: date
        _inputs:
          year:
            type: text
            comment: Optional. Set the same year on consecutive entries to group them (month goes in Date).
          date:
            type: text
            comment: The date shown beside the rail — a year (`2019`), a quarter (`Q3 2026`), or a month when Year is set.
          title:
            type: text
            comment: What happened.
          body:
            type: textarea
            comment: Optional supporting copy. Title-only entries are valid.
          iconName:
            type: select
            label: Split icon
            comment: Optional icon shown in Split layout. Leave blank for a dot.
            options:
              values: data.icons
              preview:
                text:
                  - key: iconName
                image:
                  - template: src/icons/{iconName}.svg
