label:
  type: text
  comment: Accessible label for the video modal dialog.
title:
  type: text
  comment: Video title for accessibility and display.
media:
  type: object
  label: Video
  comment: "The video to play: a YouTube or Vimeo ID, or a local file."
  options:
    preview:
      icon: videocam
      text:
        - Video
      subtext:
        - key: type
    structures:
      id_key: type
      reorder_inputs: true
      remove_extra_inputs: true
      values:
        - label: YouTube
          icon: smart_display
          value:
            type: youtube
            videoId: ""
        - label: Vimeo
          icon: smart_display
          value:
            type: vimeo
            videoId: ""
        - label: Local Source
          icon: video_file
          value:
            type: local-source
            source: ""
media.type:
  type: select
  comment: Video source type.
  options:
    values:
      - id: youtube
        name: YouTube
      - id: vimeo
        name: Vimeo
      - id: local-source
        name: Local Source
media.videoId:
  type: text
  comment: The YouTube or Vimeo video ID.
media.source:
  type: file
  label: Video Source
  comment: A locally hosted video file.
  options:
    accepts_mime_types:
      - video/mp4
      - video/webm
      - video/ogg
    paths:
      uploads: public/videos
      static: public
trigger:
  type: object
  comment: Open the video from a button, or from a poster image with a play disc over it.
  options:
    preview:
      icon: play_circle
      text:
        - Trigger
      subtext:
        - key: style
    structures:
      id_key: style
      reorder_inputs: true
      remove_extra_inputs: true
      values:
        - label: Button
          icon: touch_app
          value:
            style: button
            text: Watch video
            variant: primary
            size: md
            iconName: play-circle
        - label: Poster image
          icon: image
          value:
            style: poster
            image: ""
            alt: ""
            aspectRatio: widescreen
trigger.style:
  type: select
  label: Trigger style
  options:
    values:
      - id: button
        name: Button
      - id: poster
        name: Poster image
trigger.image:
  type: image
  label: Poster image
  comment: Still frame shown before playback. Without one, the trigger is a play button.
  options:
    paths:
      uploads: src/assets/images
      static: ""
trigger.alt:
  type: text
  label: Poster alt
  comment: Accessible description of the poster image. Leave empty for a decorative still.
trigger.aspectRatio:
  type: select
  label: Poster aspect ratio
  comment: Crop of the poster image.
  options:
    values:
      - id: widescreen
        name: Widescreen (16:9)
      - id: landscape
        name: Landscape (4:3)
      - id: square
        name: Square (1:1)
      - id: none
        name: Natural
trigger.text:
  type: text
  label: Button text
  comment: Text displayed on the button that opens the video modal.
trigger.variant:
  type: select
  label: Button variant
  comment: Visual style of the trigger button.
  options:
    values:
      - id: primary
        name: Primary
      - id: secondary
        name: Secondary
      - id: tertiary
        name: Tertiary
      - id: ghost
        name: Ghost
      - id: text
        name: Text
trigger.size:
  type: select
  label: Button size
  comment: Size of the trigger button.
  options:
    values:
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
trigger.iconName:
  type: select
  label: Button icon
  comment: Icon on the trigger button.
  options:
    values: data.icons
    preview:
      text:
        - key: name
      image:
        - template: src/icons/{id}.svg
size:
  type: select
  comment: Maximum width of the video modal.
  options:
    values:
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
