label:
  type: text
  comment: Accessible label for the video modal dialog.
type:
  type: select
  comment: Video source type.
  options:
    values:
      - id: youtube
        name: YouTube
      - id: vimeo
        name: Vimeo
      - id: local-source
        name: Local Source
title:
  type: text
  comment: Video title for accessibility and display.
videoId:
  type: text
  comment: Used for externally hosted videos — enter the YouTube or Vimeo video ID.
  hidden: type=local-source
source:
  type: file
  label: Video Source
  comment: Used for locally hosted videos — select a video file.
  hidden: type!=local-source
  options:
    accepts_mime_types:
      - video/mp4
      - video/webm
      - video/ogg
    paths:
      uploads: public/videos
      static: public
triggerStyle:
  type: select
  comment: Open the video from a button, or from a poster image with a play disc over it.
  options:
    values:
      - id: button
        name: Button
      - id: poster
        name: Poster image
posterImage:
  type: image
  comment: The still frame shown before the video plays. Required for the poster trigger.
  hidden: "triggerStyle !== 'poster'"
  options:
    paths:
      uploads: src/assets/images
      static: ""
posterAlt:
  type: text
  comment: Accessible description of the poster image. Leave empty for a decorative still.
  hidden: "triggerStyle !== 'poster'"
posterAspectRatio:
  type: select
  comment: Crop of the poster image.
  hidden: "triggerStyle !== 'poster'"
  options:
    values:
      - id: widescreen
        name: Widescreen (16:9)
      - id: landscape
        name: Landscape (4:3)
      - id: square
        name: Square (1:1)
      - id: none
        name: Natural
triggerText:
  type: text
  comment: Text displayed on the button that opens the video modal.
  hidden: "triggerStyle === 'poster'"
triggerVariant:
  type: select
  comment: Visual style of the trigger button.
  hidden: "triggerStyle === 'poster'"
  options:
    values:
      - id: primary
        name: Primary
      - id: secondary
        name: Secondary
      - id: tertiary
        name: Tertiary
      - id: ghost
        name: Ghost
      - id: text
        name: Text
triggerSize:
  type: select
  comment: Size of the trigger button.
  options:
    values:
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
triggerIconName:
  type: select
  comment: Optional icon for the trigger button. Sourced from [Heroicons](https://heroicons.com/).
  options:
    values: data.icons
    preview:
      text:
        - key: name
      image:
        - template: src/icons/{id}.svg
size:
  type: select
  comment: Maximum width of the video modal.
  options:
    values:
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
