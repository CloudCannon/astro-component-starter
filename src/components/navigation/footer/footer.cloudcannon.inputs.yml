logoSource:
  type: image
  comment: Logo image path or URL. Leave empty to hide the logo.
  options:
    resize_style: contain
    width: 1920
    height: 1280
logoAlternateSource:
  type: image
  comment: Logo shown instead when a visitor toggles the site theme.
  options:
    resize_style: contain
    width: 1920
    height: 1280
logoAlt:
  type: text
  comment: Alt text for the logo image.
links:
  type: array
  comment: Navigation links shown in the footer.
  options:
    structures: _structures.linkItems
socials:
  type: array
  comment: Social media links shown in the footer.
  options:
    structures: _structures.socialItems
footerText:
  type: markdown
  comment: Legal or copyright text at the bottom of the footer.
  options:
    blockquote: false
    bold: true
    format:
    italic: true
    link: true
    strike: false
    subscript: false
    superscript: false
    underline: false
    bulletedlist: false
    numberedlist: false
    removeformat: true
