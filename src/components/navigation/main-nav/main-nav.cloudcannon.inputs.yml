logoSource:
  type: image
  comment: Logo image path or URL. Leave empty to hide the logo.
  options:
    resize_style: contain
    width: 1920
    height: 1280
logoAlternateSource:
  type: image
  comment: Logo shown instead when a visitor toggles the site theme.
  options:
    resize_style: contain
    width: 1920
    height: 1280
logoAlt:
  type: text
  comment: Alt text for the logo image.
navData:
  type: array
  comment: Navigation items with a name, path, and children, up to 3 levels deep.
  options:
    structures: _structures.navItemLevel1MegaMenu
buttonSections:
  type: array
  comment: Buttons shown in the navigation bar.
  options:
    structures: _structures.buttonSections
search:
  type: switch
  comment: Shows a site search button in the navigation bar.
searchPlaceholder:
  type: text
  comment: "Placeholder text for the search input. Leave empty for the default."
themeToggle:
  type: switch
  comment: Shows the light/dark theme toggle. Locked sections keep their scheme.
