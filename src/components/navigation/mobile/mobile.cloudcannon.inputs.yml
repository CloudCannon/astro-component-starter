logoSource:
  type: image
  label: Logo Source
  comment: Logo image path or URL.
  options:
    resize_style: contain
    width: 1920
    height: 1280
logoAlt:
  type: text
  label: Logo Alt Text
  comment: Alt text for the logo image.
navData:
  type: array
  label: Navigation Data
  comment: Navigation items with a name, path, and children, up to 3 levels deep.
  options:
    structures: _structures.navItemLevel1
