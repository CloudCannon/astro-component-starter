eyebrow:
  type: text
  comment: Short uppercase kicker above the heading. Leave empty to hide.
heading:
  type: text
  comment: Headline for the section.
headingLevel:
  type: select
  comment: Heading level for this section's title. Use h1 only on the section that opens the page, and only once per page.
  options:
    values:
      - h1
      - h2
      - h3
subtext:
  type: markdown
  comment: Muted supporting line under the heading. Leave empty to hide.
items:
  type: array
  label: Cards
  comment: The cards in the collection, in display order.
  options:
    structures: _structures.cardCollectionItems
layout:
  type: select
  comment: Grid crops every cover to the same shape and lines the cards up in rows; Masonry keeps each cover's own shape and packs the columns top-up.
  options:
    values:
      - id: grid
        name: Grid
      - id: masonry
        name: Masonry
columns:
  type: range
  comment: Number of columns on screens 640px and up (small screens always show one).
  options:
    min: 2
    max: 4
    step: 1
gap:
  type: select
  comment: The gap between cards.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
aspectRatio:
  type: select
  comment: How every card cover is cropped. Grid layout only — Masonry always keeps each image's natural shape.
  options:
    values:
      - id: landscape
        name: Landscape (4:3)
      - id: widescreen
        name: Widescreen (16:9)
      - id: square
        name: Square (1:1)
      - id: portrait
        name: Portrait (3:4)
      - id: none
        name: Natural

# --- section wrapper inputs (CustomSection) ---
# Configures the CustomSection wrapper, not this section's own content. Inline
# per component so a project can trim the size/padding lists in place.
# `new:component` slices from this marker down — keep the marker line verbatim.
sectionLabel:
  type: text
  comment: Optional label to identify the section in the editor. When set and no HTML id is provided, an id is derived from this value.
maxContentWidth:
  type: select
  comment: Maximum width constraint for the content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
paddingHorizontal:
  type: select
  comment: Horizontal padding applied to the section content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
paddingVertical:
  type: select
  comment: Vertical padding applied to the section content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
      - id: 4xl
        name: 4xl
      - id: 5xl
        name: 5xl
      - id: 6xl
        name: 6xl
colorScheme:
  type: select
  comment: Color scheme theme for the section wrapper.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
lockColorScheme:
  type: switch
  label: Lock color scheme
  comment: Keep this section on the color scheme above when a visitor toggles the site theme. Only has an effect when Color Scheme is Light or Dark.
backgroundColor:
  type: select
  comment: Solid background color token behind the section content.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
