teamGrid:
  template: mdx_component
  inline: false
  preview:
    text:
      - Team Grid
    subtext:
      - key: subtext
    image: public/component-previews/page-sections/collections/team-grid.svg
    icon: groups
    gallery:
      image: public/component-previews/page-sections/collections/team-grid.svg
  definitions:
    component_name: TeamGrid
    named_args:
      - editor_key: sectionLabel
        type: string
        optional: true
        remove_empty: true
      - editor_key: maxContentWidth
        type: string
        optional: true
        remove_empty: true
      - editor_key: paddingHorizontal
        type: string
        optional: true
        remove_empty: true
      - editor_key: paddingVertical
        type: string
        optional: true
        remove_empty: true
      - editor_key: eyebrow
        type: string
        optional: true
        remove_empty: true
      - editor_key: heading
        type: string
        optional: true
        remove_empty: true
      - editor_key: subtext
        type: string
        optional: true
        remove_empty: true
      - editor_key: teamMembers
        type: array
      - editor_key: colorScheme
        type: string
        optional: true
        remove_empty: true
      - editor_key: backgroundColor
        type: string
        optional: true
        remove_empty: true
  _inputs_from_glob:
    - /src/components/page-sections/collections/team-grid/team-grid.cloudcannon.inputs.yml
