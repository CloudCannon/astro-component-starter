label: Contact Split
icon: contact_mail
description: Contact details beside a form, in a bordered card with an optional map strip.
value:
  _component: page-sections/conversion/contact-split
  sectionLabel: ""
  eyebrow: Contact
  heading: Talk to a human
  subtext: We answer within one business day.
  details:
    - icon: map-pin
      label: Address
      value: 12 Vogel Street, Dunedin 9016, New Zealand
      url: ""
    - icon: phone
      label: Phone
      value: +64 3 555 0142
      url: "tel:+6435550142"
    - icon: envelope
      label: Email
      value: hello@example.com
      url: "mailto:hello@example.com"
    - icon: clock
      label: Hours
      value: Mon–Fri, 9am–5pm NZST
      url: ""
  formAction: ./
  formBlocks:
    - _component: building-blocks/forms/input
      label: Name
      name: name
