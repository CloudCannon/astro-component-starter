ctaForm:
  template: mdx_component
  inline: false
  preview:
    text:
      - CTA Form
    subtext:
      - key: heading
    image: public/component-previews/page-sections/conversion/cta-form.svg
    icon: call_to_action
    gallery:
      image: public/component-previews/page-sections/conversion/cta-form.svg
  definitions:
    component_name: CtaForm
    named_args:
      - editor_key: sectionLabel
        type: string
        optional: true
        remove_empty: true
      - editor_key: maxContentWidth
        type: string
        optional: true
        remove_empty: true
      - editor_key: paddingHorizontal
        type: string
        optional: true
        remove_empty: true
      - editor_key: paddingVertical
        type: string
        optional: true
        remove_empty: true
      - editor_key: heading
        type: string
        optional: true
        remove_empty: true
      - editor_key: subtext
        type: string
        optional: true
        remove_empty: true
      - editor_key: formAction
        type: string
        optional: true
        remove_empty: true
      - editor_key: formBlocks
        type: array
      - editor_key: imageSource
        type: string
        optional: true
        remove_empty: true
      - editor_key: imageAlt
        type: string
        optional: true
        remove_empty: true
      - editor_key: reverse
        type: boolean
        optional: true
      - editor_key: colorScheme
        type: string
        optional: true
        remove_empty: true
      - editor_key: backgroundColor
        type: string
        optional: true
        remove_empty: true
  _inputs_from_glob:
    - /src/components/page-sections/conversion/cta-form/cta-form.cloudcannon.inputs.yml
