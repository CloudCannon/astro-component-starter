ctaSplit:
  template: mdx_component
  inline: false
  preview:
    text:
      - CTA Split
    subtext:
      - key: heading
    image: public/component-previews/page-sections/conversion/cta-split.svg
    icon: call_to_action
    gallery:
      image: public/component-previews/page-sections/conversion/cta-split.svg
      fit: cover
  definitions:
    component_name: CtaSplit
    named_args:
      - editor_key: sectionLabel
        type: string
        optional: true
        remove_empty: true
      - editor_key: maxContentWidth
        type: string
        optional: true
        remove_empty: true
      - editor_key: paddingHorizontal
        type: string
        optional: true
        remove_empty: true
      - editor_key: paddingVertical
        type: string
        optional: true
        remove_empty: true
      - editor_key: heading
        type: string
        optional: true
        remove_empty: true
      - editor_key: subtext
        type: string
        optional: true
        remove_empty: true
      - editor_key: imageSource
        type: string
        optional: true
        remove_empty: true
      - editor_key: imageAlt
        type: string
        optional: true
        remove_empty: true
      - editor_key: buttonSections
        type: array
        optional: true
      - editor_key: reverse
        type: boolean
        optional: true
      - editor_key: colorScheme
        type: string
        optional: true
        remove_empty: true
      - editor_key: backgroundColor
        type: string
        optional: true
        remove_empty: true
  _inputs_from_glob:
    - /src/components/page-sections/conversion/cta-split/cta-split.cloudcannon.inputs.yml
