eyebrow:
  type: text
  comment: Optional short label above the heading.
heading:
  type: text
  comment: Headline for the newsletter signup.
headingLevel:
  type: select
  comment: Heading level for this section's title. Use h1 only on the section that opens the page, and only once per page.
  options:
    values:
      - h1
      - h2
      - h3
subtext:
  type: markdown
  comment: Supporting copy beneath the headline.
  options:
    blockquote: false
    bold: true
    format:
    italic: true
    link: true
    strike: false
    subscript: true
    superscript: true
    underline: false
    bulletedlist: false
    numberedlist: false
formAction:
  type: url
  label: Form action
  comment: URL that receives the email address. Leave empty to submit to the current page.
formMethod:
  type: select
  label: Form method
  comment: Use the method required by the service receiving the signup.
  options:
    values:
      - id: post
        name: POST
      - id: get
        name: GET
formName:
  type: text
  label: Form name
  comment: Name sent with the form for services that identify forms by name.
emailName:
  type: text
  label: Email field name
  comment: Name sent for the email address. Check your email provider's requirements.
emailLabel:
  type: text
  label: Email label
  comment: Accessible label for the email field. It is not shown visually.
emailPlaceholder:
  type: text
  label: Email placeholder
  comment: Example address shown inside the email field.
buttonText:
  type: text
  label: Button text
  comment: Label on the submit button.
disclaimer:
  type: markdown
  comment: Optional consent or privacy note below the form.
  options:
    blockquote: false
    bold: true
    format:
    italic: true
    link: true
    strike: false
    subscript: false
    superscript: false
    underline: false
    bulletedlist: false
    numberedlist: false
layout:
  type: select
  comment: Band places the form beside the copy. Card stacks them in a centred panel.
  options:
    values:
      - id: band
        name: Band
      - id: card
        name: Card
panelBackgroundColor:
  type: select
  label: Panel background color
  comment: Background of the bordered panel that holds the copy and form. None lets the section background show through.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight

# --- section wrapper inputs (CustomSection) ---
# Configures the CustomSection wrapper, not this section's own content. Inline
# per component so a project can trim the size/padding lists in place.
# `new:component` slices from this marker down — keep the marker line verbatim.
sectionLabel:
  type: text
  comment: Optional label to identify the section in the editor. When set and no HTML id is provided, an id is derived from this value.
maxContentWidth:
  type: select
  comment: Maximum width constraint for the content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
paddingHorizontal:
  type: select
  comment: Horizontal padding applied to the section content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
paddingVertical:
  type: select
  comment: Vertical padding applied to the section content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
      - id: 4xl
        name: 4xl
      - id: 5xl
        name: 5xl
      - id: 6xl
        name: 6xl
colorScheme:
  type: select
  comment: Color scheme theme for the section wrapper.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
lockColorScheme:
  type: switch
  label: Lock color scheme
  comment: Keep this section on the color scheme above when a visitor toggles the site theme. Only has an effect when Color Scheme is Light or Dark.
backgroundColor:
  type: select
  comment: Solid background color token behind the section content.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
