featureGrid:
  template: mdx_component
  inline: false
  preview:
    text:
      - Feature Grid
    subtext:
      - key: heading
    image: public/component-previews/page-sections/explainers/feature-grid.svg
    icon: apps
    gallery:
      image: public/component-previews/page-sections/explainers/feature-grid.svg
      fit: cover
  definitions:
    component_name: FeatureGrid
    named_args:
      - editor_key: sectionLabel
        type: string
        optional: true
        remove_empty: true
      - editor_key: maxContentWidth
        type: string
        optional: true
        remove_empty: true
      - editor_key: paddingHorizontal
        type: string
        optional: true
        remove_empty: true
      - editor_key: paddingVertical
        type: string
        optional: true
        remove_empty: true
      - editor_key: eyebrow
        type: string
        optional: true
        remove_empty: true
      - editor_key: heading
        type: string
        optional: true
        remove_empty: true
      - editor_key: subtext
        type: string
        optional: true
        remove_empty: true
      - editor_key: features
        type: array
      - editor_key: colorScheme
        type: string
        optional: true
        remove_empty: true
      - editor_key: backgroundColor
        type: string
        optional: true
        remove_empty: true
  _inputs_from_glob:
    - /src/components/page-sections/explainers/feature-grid/feature-grid.cloudcannon.inputs.yml
