eyebrow:
  type: text
  comment: Optional eyebrow text displayed above the heading.
heading:
  type: text
  comment: Main heading for the split section.
subtext:
  type: markdown
  comment: Supporting body copy beneath the heading.
  options:
    blockquote: false
    bold: true
    format:
    italic: true
    link: true
    strike: false
    subscript: true
    superscript: true
    underline: false
    bulletedlist: false
    numberedlist: false
buttonSections:
  type: array
  comment: Calls-to-action shown beneath the copy block.
  options:
    structures: _structures.buttonSections
imageSource:
  type: image
  comment: Optional image displayed above the feature list.
  options:
    paths:
      uploads: src/assets/images
      static: ""
    resize_style: contain
    width: 1920
    height: 1280
imageAlt:
  type: text
  comment: Alt text describing the image content.
imageAspectRatio:
  type: select
  comment: Aspect ratio applied to the image.
  options:
    values:
      - id: none
        name: None
      - id: portrait
        name: Portrait
      - id: square
        name: Square
      - id: landscape
        name: Landscape
      - id: widescreen
        name: Widescreen
imageRounded:
  type: switch
  comment: Toggles rounded corners on the image.
reverse:
  type: switch
  comment: Flips the layout so the feature list appears before the copy.

# --- section wrapper inputs (CustomSection) ---
# Configures the CustomSection wrapper, not this section's own content. Inline
# per component so a project can trim the size/padding lists in place.
# `new:component` slices from this marker down — keep the marker line verbatim.
sectionLabel:
  type: text
  comment: Optional label to identify the section in the editor. When set and no HTML id is provided, an id is derived from this value.
maxContentWidth:
  type: select
  comment: Maximum width constraint for the content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
paddingHorizontal:
  type: select
  comment: Horizontal padding applied to the section content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
paddingVertical:
  type: select
  comment: Vertical padding applied to the section content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
      - id: 4xl
        name: 4xl
      - id: 5xl
        name: 5xl
      - id: 6xl
        name: 6xl
colorScheme:
  type: select
  comment: Color scheme theme for the section wrapper.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
lockColorScheme:
  type: switch
  label: Lock color scheme
  comment: Keep this section on the color scheme above when a visitor toggles the site theme. Only has an effect when Color Scheme is Light or Dark.
backgroundColor:
  type: select
  comment: Solid background color token behind the section content.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
background:
  type: object
  comment: "Optional background: a cover image, a looping HTML5 video (self-hosted), or a repeating tiled pattern image. Shared positioning applies to image and video. Video is hidden when the user prefers reduced motion."
  options:
    preview:
      icon: wallpaper
      text:
        - Background
      subtext:
        - key: type
background.type:
  type: select
  label: Background type
  comment: A cover image, a muted autoplay video, or a repeating tiled pattern.
  options:
    values:
      - id: image
        name: Image
      - id: video
        name: Video
      - id: pattern
        name: Pattern
background.positionVertical:
  comment: Vertical focal point (object-position for video; image position for pictures). Not used for patterns.
  type: select
  options:
    values:
      - id: top
        name: Top
      - id: center
        name: Center
      - id: bottom
        name: Bottom
background.positionHorizontal:
  comment: Horizontal focal point (object-position for video; image position for pictures). Not used for patterns.
  type: select
  options:
    values:
      - id: left
        name: Left
      - id: center
        name: Center
      - id: right
        name: Right
background.fixed:
  type: switch
  label: Fixed background (parallax)
  comment: Pin the background image in place so the section scrolls over it.
  hidden: "background.type !== 'image'"
background.priority:
  type: switch
  label: Prioritize image load
  comment: When using a background image, load it eagerly (use for above-the-fold sections).
  hidden: "background.type !== 'image'"
background.imageSource:
  comment: URL or path to the background or pattern image. Used by the Image and Pattern types.
  type: image
  hidden: "background.type !== 'image'"
  options:
    paths:
      uploads: src/assets/images
      static: ""
    resize_style: contain
    width: 1920
    height: 1280
background.patternSize:
  type: select
  label: Pattern tile size
  comment: Only applies when Background type is Pattern. How large each repeated tile renders — Natural uses the image's own size.
  options:
    values:
      - id: natural
        name: Natural
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
background.imageAlt:
  comment: Alt text for the background image.
  type: textarea
  hidden: "background.type !== 'image'"
background.videoSource:
  type: file
  label: Video source
  comment: Path to a video under public/videos. Sibling formats with the same basename are added automatically when present.
  hidden: "background.type !== 'video'"
  options:
    accepts_mime_types:
      - video/mp4
      - video/webm
      - video/ogg
    paths:
      uploads: public/videos
      static: public
background.overlay:
  type: range
  comment: "Overlay in front of the background (-1.0 to 1.0). Negative values darken, positive values lighten."
  options:
    min: -1
    max: 1
    step: 0.1
