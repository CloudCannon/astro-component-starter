steps:
  type: array
  label: Steps
  comment: Steps shown one at a time as the section scrolls past.
  options:
    structures: _structures.scrollStepperSteps
mediaPosition:
  type: select
  label: Media position
  comment: Which side the pinned media column sits on. Ignored below 768px, where each step shows its own image.
  options:
    values:
      - id: start
        name: Start
      - id: end
        name: End
mediaWidth:
  type: select
  label: Media width
  comment: How much of the row the media column takes.
  options:
    values:
      - id: half
        name: Half
      - id: wide
        name: Wide
      - id: narrow
        name: Narrow
imageAspectRatio:
  type: select
  label: Media aspect ratio
  comment: Shared by every step so the pinned panel does not change height as steps swap.
  options:
    values:
      - id: none
        name: None
      - id: square
        name: Square
      - id: landscape
        name: Landscape
      - id: portrait
        name: Portrait
      - id: widescreen
        name: Widescreen
      - id: horizontal-strip
        name: Horizontal strip
progressStyle:
  type: select
  label: Progress indicator
  comment: A bar that fills by step, dots, or nothing.
  options:
    values:
      - id: bar
        name: Bar
      - id: dots
        name: Dots
      - id: none
        name: None
stepHeight:
  type: select
  label: Step height
  comment: Screen gives each step a full viewport to scroll through; Content packs them closer.
  options:
    values:
      - id: screen
        name: Screen
      - id: content
        name: Content
headingLevel:
  type: select
  label: Step heading level
  comment: Heading level for each step title. Pick the one that keeps the page outline in order.
  options:
    values:
      - id: h2
        name: H2
      - id: h3
        name: H3
      - id: h4
        name: H4

# --- section wrapper inputs (CustomSection) ---
# Configures the CustomSection wrapper, not this section's own content. Inline
# per component so a project can trim the size/padding lists in place.
# `new:component` slices from this marker down — keep the marker line verbatim.
sectionLabel:
  type: text
  comment: Optional label to identify the section in the editor. When set and no HTML id is provided, an id is derived from this value.
maxContentWidth:
  type: select
  comment: Maximum width constraint for the content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
paddingHorizontal:
  type: select
  comment: Horizontal padding applied to the section content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
paddingVertical:
  type: select
  comment: Vertical padding applied to the section content.
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
      - id: 4xl
        name: 4xl
      - id: 5xl
        name: 5xl
      - id: 6xl
        name: 6xl
colorScheme:
  type: select
  comment: Color scheme theme for the section wrapper.
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark
lockColorScheme:
  type: switch
  label: Lock color scheme
  comment: Keep this section on the color scheme above when a visitor toggles the site theme. Only has an effect when Color Scheme is Light or Dark.
backgroundColor:
  type: select
  comment: Solid background color token behind the section content.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
background:
  type: object
  comment: "Optional background: a cover image, a looping HTML5 video (self-hosted), or a repeating tiled pattern image. Shared positioning applies to image and video. Video is hidden when the user prefers reduced motion."
  options:
    preview:
      icon: wallpaper
      text:
        - Background
      subtext:
        - key: type
background.type:
  type: select
  label: Background type
  comment: A cover image, a muted autoplay video, or a repeating tiled pattern.
  options:
    values:
      - id: image
        name: Image
      - id: video
        name: Video
      - id: pattern
        name: Pattern
background.positionVertical:
  comment: Vertical focal point (object-position for video; image position for pictures). Not used for patterns.
  type: select
  options:
    values:
      - id: top
        name: Top
      - id: center
        name: Center
      - id: bottom
        name: Bottom
background.positionHorizontal:
  comment: Horizontal focal point (object-position for video; image position for pictures). Not used for patterns.
  type: select
  options:
    values:
      - id: left
        name: Left
      - id: center
        name: Center
      - id: right
        name: Right
background.fixed:
  type: switch
  label: Fixed background (parallax)
  comment: Pin the background image in place so the section scrolls over it.
  hidden: "background.type !== 'image'"
background.priority:
  type: switch
  label: Prioritize image load
  comment: When using a background image, load it eagerly (use for above-the-fold sections).
  hidden: "background.type !== 'image'"
background.imageSource:
  comment: URL or path to the background or pattern image. Used by the Image and Pattern types.
  type: image
  hidden: "background.type !== 'image' && background.type !== 'pattern'"
  options:
    paths:
      uploads: src/assets/images
      static: ""
    resize_style: contain
    width: 1920
    height: 1280
background.patternSize:
  type: select
  label: Pattern tile size
  comment: Only applies when Background type is Pattern. How large each repeated tile renders — Natural uses the image's own size.
  options:
    values:
      - id: natural
        name: Natural
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
background.imageAlt:
  comment: Alt text for the background image.
  type: textarea
  hidden: "background.type !== 'image'"
background.videoSource:
  type: file
  label: Video source
  comment: Path to a video under public/videos. Sibling formats with the same basename are added automatically when present.
  hidden: "background.type !== 'video'"
  options:
    accepts_mime_types:
      - video/mp4
      - video/webm
      - video/ogg
    paths:
      uploads: public/videos
      static: public
background.overlay:
  type: range
  comment: "Overlay in front of the background (-1.0 to 1.0). Negative values darken, positive values lighten."
  options:
    min: -1
    max: 1
    step: 0.1
