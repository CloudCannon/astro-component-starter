label: Scroll Stepper
icon: view_day
description: Steps that scroll past a pinned illustration.
value:
  _component: page-sections/explainers/scroll-stepper
  sectionLabel: ""
  steps:
    - _component: page-sections/explainers/scroll-stepper/scroll-stepper-step
      eyebrow: Step one
      title: Draft the page in the editor
      description: Pick sections from the library and fill them in. No ticket, no deploy.
      imageSource: /src/assets/images/component-docs/sunset.jpg
      imageAlt: Sun setting over a headland
    - _component: page-sections/explainers/scroll-stepper/scroll-stepper-step
      eyebrow: Step two
      title: Share a preview link
      description: Every branch builds to its own URL, so reviewers see the real page.
      imageSource: /src/assets/images/component-docs/dunedin-cliff.jpg
      imageAlt: Sea cliffs above a bay
    - _component: page-sections/explainers/scroll-stepper/scroll-stepper-step
      eyebrow: Step three
      title: Publish when it is right
      description: Merging takes it live. The same components, the same tokens, no surprises.
      imageSource: /src/assets/images/component-docs/quiet-street.jpg
      imageAlt: A quiet residential street
  mediaPosition: start
  mediaWidth: half
  imageAspectRatio: landscape
  progressStyle: bar
  stepHeight: screen
  headingLevel: h3
  maxContentWidth: xl
  paddingHorizontal: lg
  paddingVertical: 4xl
  colorScheme: inherit
  lockColorScheme: false
  backgroundColor: base
  background:
    type: image
    positionVertical: top
    positionHorizontal: center
    fixed: false
    priority: false
    imageSource: ""
    imageAlt: ""
    patternSize: natural
    mask: none
    videoSource: null
    overlay: 0
preview:
  text:
    - Scroll Stepper
  image: public/component-previews/page-sections/explainers/scroll-stepper.svg
  icon: view_day
  gallery:
    image: public/component-previews/page-sections/explainers/scroll-stepper.svg
    fit: cover
picker_preview:
  text: Scroll Stepper
  subtext: Steps that scroll past a pinned illustration.
  image: public/component-previews/page-sections/explainers/scroll-stepper.svg
  gallery:
    image: public/component-previews/page-sections/explainers/scroll-stepper.svg
    fit: cover
_structures:
  scrollStepperSteps:
    values:
      - label: Step
        icon: view_day
        value:
          _component: page-sections/explainers/scroll-stepper/scroll-stepper-step
          eyebrow: ""
          title: Step title
          description: Short description for this step.
          imageSource: /src/assets/images/component-docs/sunset.jpg
          imageAlt: Step image alt text
        preview:
          text:
            - key: title
            - Step
          subtext:
            - key: description
            - Add description for this step
        _inputs:
          eyebrow:
            type: text
            comment: Optional eyebrow text displayed above the title.
          title:
            type: text
            comment: Heading text shown for this step.
          description:
            type: markdown
            comment: Supporting body copy shown under the title.
          imageSource:
            type: image
            comment: Image shown in the pinned media column while this step is active.
            options:
              paths:
                uploads: src/assets/images
                static: ""
              resize_style: contain
              width: 1920
              height: 1280
          imageAlt:
            type: text
            comment: Alt text describing the step image.
_inputs_from_glob:
  - /src/components/page-sections/explainers/scroll-stepper/scroll-stepper.cloudcannon.inputs.yml
  - /.cloudcannon/inputs/background-mask.yml
groups:
  - heading: Content
    inputs:
      - steps
  - heading: Layout
    inputs:
      - mediaPosition
      - mediaWidth
      - imageAspectRatio
      - progressStyle
      - stepHeight
      - headingLevel
  - heading: Section settings
    comment: Width, spacing, color scheme, and background for this section.
    collapsed: true
    inputs:
      - sectionLabel
      - maxContentWidth
      - paddingHorizontal
      - paddingVertical
      - colorScheme
      - lockColorScheme
      - backgroundColor
      - background
