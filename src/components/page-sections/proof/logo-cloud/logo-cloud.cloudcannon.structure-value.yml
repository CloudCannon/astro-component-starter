      - label: Logo
        icon: workspaces
        value:
          image: ""
          alt: ""
          url: ""
        preview:
          text:
            - key: alt
            - Logo
          image:
            - key: image
        _inputs:
          image:
            type: image
            comment: The logo image. Constrained by height, so any aspect ratio works.
            options:
              paths:
                static: ""
